# ============================================================================
# 生产前置 nginx（可选）
#
# docker compose --profile prod up -d
#
# 它做四件事，都是 Go API 不该自己做的事：
#   1. TLS 终止（证书挂 /etc/nginx/certs）
#   2. SSE 长连接的超时与缓冲治理（proxy_buffering off 必须开，否则事件会被攒着不发）
#   3. 静态资源强缓存 + API 不缓存
#   4. 单一入口限流（按 IP 令牌桶）
#
# Go API 本身也托管前端静态文件，所以这一层不是必需的 —— 单机部署可以只用 Go。
# 需要 TLS、需要多实例负载均衡、需要和别的业务共用 443 时再上它。
# ============================================================================

upstream waterlog_api {
    server api:8200;
    keepalive 32;
}

# SSE 需要按 IP 限流，因为一条连接会挂很久
limit_req_zone $binary_remote_addr zone=wl_api:10m rate=20r/s;

server {
    listen 80;
    server_name _;

    # 生产环境把 80 全量跳 443；本机演示保留 80 直出
    # return 301 https://$host$request_uri;

    client_max_body_size 2m;

    # ------------------------------------------------------------ 前端静态
    # 带 hash 的产物可以永久缓存
    location /assets/ {
        proxy_pass http://waterlog_api;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html 绝不缓存，否则发版后用户拿着旧壳去请求已经删掉的 chunk
    location = /index.html {
        proxy_pass http://waterlog_api;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store, must-revalidate";
    }

    # ------------------------------------------------------------ SSE
    # /api/events 是长连接：必须关缓冲、关分块、拉长超时
    location = /api/events {
        proxy_pass http://waterlog_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        gzip off;
    }

    # ------------------------------------------------------------ API
    location /api/ {
        limit_req zone=wl_api burst=40 nodelay;
        proxy_pass http://waterlog_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;

        # 规则预演要跑一遍全站研判，重训请求只做排队提交，都给足时间
        proxy_read_timeout 120s;
        add_header Cache-Control "no-store";
    }

    # ------------------------------------------------------------ SPA 兜底
    location / {
        proxy_pass http://waterlog_api;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
    }
}

