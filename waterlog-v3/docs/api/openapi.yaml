openapi: 3.1.0

info:
  title: waterlog-v3 API
  version: 1.0.0
  summary: 城市内涝水位预测与预警平台
  description: |
    统一对外接口。前端（React SPA）与运维脚本都只跟这个服务打交道；
    Python 预测引擎不对外暴露，由本服务反代其只读视图。

    ## 三层结构

    | 层 | 端口 | 职责 |
    |---|---|---|
    | 浏览器 / nginx | 443 | TLS、限流、SSE 缓冲治理 |
    | Go API（本服务） | 8200 | 持久化、状态机、SSE、静态托管、鉴权、审计 |
    | Python 引擎 | 8201 | 特征工程、训练、预测、修正、研判（内网） |

    ## 三条约定

    1. **时间是仿真时间**。所有 `ts` / `issued_at` / `raised_at` 字段都是 Unix 秒，
       但基准是仿真时钟（60 倍速），不是墙钟。不要用它们和 `Date.now()` 相减。
    2. **错误一律 `{"error": "中文原话"}`**。业务冲突（重复确认、非法状态迁移）
       返回 409 且文案可以直接展示给值班员，前端不做二次翻译。
    3. **物理量单位写死在字段名里**：`*_level` 是绝对水位（米，含站点基准高程），
       `depth` 是积水深（米，水面减基准），`*_slope` 是变化率（米/小时），
       `rain` 是雨强（毫米/小时），`rain_fc_*` 是累计雨量（毫米）。

servers:
  - url: http://127.0.0.1:8200
    description: 本机开发
  - url: https://waterlog.example.com
    description: 生产（nginx 前置）

tags:
  - name: system
    description: 健康检查、站点元数据、系统状态
  - name: situation
    description: 一张图与站点明细
  - name: forecast
    description: 预测发布与曲线
  - name: alert
    description: 预警四态与处置闭环
  - name: model
    description: 模型评估、版本治理、重训
  - name: rules
    description: 研判规则配置与影响预演
  - name: auth
    description: 登录、当前用户、用户管理
  - name: audit
    description: 操作审计
  - name: notify
    description: 通知渠道配置与投递记录
  - name: sim
    description: 演练控制（生产环境应关闭）
  - name: ingest
    description: 数据接入（引擎推、或外部数据源推）
  - name: icm
    description: ICM 集成适配网关（外部真实数据源接入）
  - name: aiwater
    description: |
      AI 平台自研网关（/api/aiwater/v1/*）。

      与本文件其余部分**不是同一套契约**：网关用 {code,msg,data} 响应包、
      字符串错误码、camelCase 字段；其余部分用裸 JSON + {"error":...} + snake_case。
      两套都是已上线的对外契约，互不迁就。

paths:
  # ============================================================== system
  /api/health:
    get:
      tags: [system]
      summary: 健康检查
      description: |
        `engine_ok=false` 表示预测引擎不可达或还在首轮训练。此时遥测可能仍在更新
        （取决于引擎是否还活着），但预测不会刷新。前端据此渲染「预测滞后」提示，
        而不是把页面清空。
      responses:
        "200":
          description: 服务自身存活（即使引擎挂了也返回 200，靠 engine_ok 区分）
          content:
            application/json:
              schema:
                type: object
                required: [ok, service, engine_ok, ts, clients]
                properties:
                  ok: { type: boolean, example: true }
                  service: { type: string, example: waterlog-v3-api }
                  engine_ok: { type: boolean, example: true }
                  clients: { type: integer, description: 当前 SSE 连接数, example: 2 }
                  ts: { type: integer, description: 仿真当前时刻, example: 1792537745 }
                  engine_health:
                    nullable: true
                    type: object
                    properties:
                      cycles: { type: integer, description: 已完成预测轮次 }
                      model_version: { type: string }
                      pending: { type: integer, description: 已发布但未到结算时刻的预测条数 }
                      uptime_s: { type: number }
                      last_ts: { type: integer }

  /api/sites:
    get:
      tags: [system]
      summary: 站点元数据
      description: 静态属性 + 四级阈值。不含实时数据，可长缓存（前端 staleTime 5 分钟）。
      responses:
        "200":
          description: 全部站点
          content:
            application/json:
              schema:
                type: object
                properties:
                  sites:
                    type: array
                    items: { $ref: "#/components/schemas/Site" }

  # ============================================================== situation
  /api/overview:
    get:
      tags: [situation]
      summary: 一张图数据
      description: |
        把站点静态属性、最新遥测、派生量、预警研判四类信息合并成一行，按
        `warn_level` 降序、同等级按 `warn_score` 降序排列。

        **`depth` 是后端算好的，前端不要再用 `level - base_level` 重算** ——
        同一个物理量两处算，口径迟早分叉。
      responses:
        "200":
          description: 全站态势
          content:
            application/json:
              schema:
                type: object
                properties:
                  issued_at: { type: integer, description: 本轮预测发布时间, nullable: true }
                  model_version: { type: string, nullable: true }
                  sites:
                    type: array
                    items: { $ref: "#/components/schemas/OverviewSite" }

  /api/sites/{siteId}:
    get:
      tags: [situation]
      summary: 站点详情
      description: 详情页一次拿全：静态、最新实测、历史序列、完整预测、研判、决策。
      parameters:
        - $ref: "#/components/parameters/SiteId"
      responses:
        "200":
          description: 站点完整视图
          content:
            application/json:
              schema:
                type: object
                properties:
                  site: { $ref: "#/components/schemas/Site" }
                  latest: { $ref: "#/components/schemas/TelemetryRow" }
                  history:
                    type: object
                    properties:
                      site_id: { type: string }
                      step_min: { type: integer }
                      points:
                        type: array
                        description: 每项 [ts, level, rain]
                        items:
                          type: array
                          items: { type: number }
                  forecast: { $ref: "#/components/schemas/SiteForecast" }
                  issued_at: { type: integer, nullable: true }
                  model_version: { type: string, nullable: true }
        "404":
          $ref: "#/components/responses/NotFound"

  /api/sites/{siteId}/history:
    get:
      tags: [situation]
      summary: 历史序列
      parameters:
        - $ref: "#/components/parameters/SiteId"
        - name: hours
          in: query
          schema: { type: integer, default: 12, minimum: 1, maximum: 240 }
      responses:
        "200":
          description: 序列
          content:
            application/json:
              schema:
                type: object
                properties:
                  site_id: { type: string }
                  step_min: { type: integer }
                  points:
                    type: array
                    items:
                      type: array
                      items: { type: number }

  # ============================================================== forecast
  /api/forecast:
    get:
      tags: [forecast]
      summary: 最新一轮预测
      description: |
        每 60 秒（仿真时间）一轮。`curve` 是 5 分钟分辨率的加密曲线，
        每项 `[offset_min, level, lower, upper]`；`lower`/`upper` 是 90% 置信区间。

        **`lower` 与 `upper` 已各自钳制在物理约束 `[base_level, base_level + 1.5]` 内**，
        前端不需要再钳。区间宽度由分站点分预见期标定的 σ 决定。
      responses:
        "200":
          description: 全站预测
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ForecastPayload" }
        "404":
          description: 引擎尚未产出首轮预测

  # ============================================================== alert
  /api/alerts:
    get:
      tags: [alert]
      summary: 预警事件列表
      parameters:
        - name: active_only
          in: query
          description: 只看未解除的事件。`active` 是等价的旧拼写，两者都支持。
          schema: { type: boolean, default: true }
        - name: active
          in: query
          deprecated: true
          schema: { type: string, enum: ["0", "1", "true", "false"] }
        - name: limit
          in: query
          schema: { type: integer, default: 200 }
      responses:
        "200":
          description: 事件列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  alerts:
                    type: array
                    items: { $ref: "#/components/schemas/AlertEvent" }

  /api/alerts/{id}:
    get:
      tags: [alert]
      summary: 预警详情（含处置备注）
      parameters:
        - $ref: "#/components/parameters/AlertId"
      responses:
        "200":
          description: 事件与备注时间线
          content:
            application/json:
              schema:
                type: object
                properties:
                  event: { $ref: "#/components/schemas/AlertEvent" }
                  notes:
                    type: array
                    items: { $ref: "#/components/schemas/AlertNote" }
        "404":
          $ref: "#/components/responses/NotFound"

  /api/alerts/{id}/ack:
    post:
      tags: [alert]
      summary: 确认预警（阅读轴）
      description: |
        `ACTIVE_UNACK → ACTIVE_ACK`。重复确认返回 **409 + 「已确认，无需重复确认」**，
        不静默成功 —— 静默成功会让前端以为状态变了。
      parameters:
        - $ref: "#/components/parameters/AlertId"
      responses:
        "200":
          description: 已确认
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  state: { $ref: "#/components/schemas/WarnState" }
        "409":
          $ref: "#/components/responses/Conflict"

  /api/alerts/{id}/assign:
    post:
      tags: [alert]
      summary: 派单
      description: 写 `assignee`，同时落一条 `kind=dispatch` 的备注。
      parameters:
        - $ref: "#/components/parameters/AlertId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assignee]
              properties:
                assignee: { type: string, example: 排水公司 张工 }
      responses:
        "200":
          description: 已派单
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  assignee: { type: string }

  /api/alerts/{id}/disposition:
    post:
      tags: [alert]
      summary: 推进处置状态（处置轴）
      description: |
        五态机：`open → dispatched → onsite → resolved / false_alarm`，
        `resolved`/`false_alarm` 可回到 `open` 重开。

        **`dispatched → open` 故意不允许** —— 已经派出去的人不能假装没派过，
        要纠正就前进到 `false_alarm` 并写备注，留下痕迹。

        非法迁移返回 409 + 原话（如「不能从「已处置」直接改为「误报归档」」），
        同态重复返回 409 + 原话（如「已经是「已到场」，无需重复操作」）。
      parameters:
        - $ref: "#/components/parameters/AlertId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [disposition]
              properties:
                disposition: { $ref: "#/components/schemas/Disposition" }
                note: { type: string }
                author: { type: string }
      responses:
        "200":
          description: 已推进
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  disposition: { $ref: "#/components/schemas/Disposition" }
        "409":
          $ref: "#/components/responses/Conflict"

  /api/alerts/{id}/notes:
    post:
      tags: [alert]
      summary: 追加处置备注
      parameters:
        - $ref: "#/components/parameters/AlertId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
                author: { type: string }
                kind: { type: string, enum: [note, dispatch, status], default: note }
      responses:
        "200":
          description: 已记录
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  id: { type: integer }

  # ============================================================== model
  /api/metrics:
    get:
      tags: [model]
      summary: 模型指标与在线滚动评估
      description: |
        `latest` 是最近一次训练的完整产物（四模型族 × 四预见期 + 事件样本 + 特征重要性）；
        `rolling` 是按预见期分组的**在线**滚动评估，用仿真时钟窗口。

        **`skill` 的分母是持久化基线**（发布预测时的实测水位），不是实际值的标准差。
        用后者会把跨站点高程差算进基线，skill 虚抬到 0.98。
      parameters:
        - name: window_h
          in: query
          schema: { type: integer, default: 6, minimum: 1, maximum: 48 }
      responses:
        "200":
          description: 指标包
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetricsResp" }

  /api/decisions:
    get:
      tags: [model]
      summary: 智能体值班决策日志
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 40, maximum: 500 }
      responses:
        "200":
          description: 决策列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  decisions:
                    type: array
                    items: { $ref: "#/components/schemas/DecisionRow" }

  /api/eval/pairs:
    get:
      tags: [model]
      summary: 预测 vs 实际配对
      description: 已结算的预测与其实际值。散点图画的是**积水深**（`yhat - base_level`），不是绝对水位。
      parameters:
        - name: hours
          in: query
          schema: { type: integer, default: 12 }
      responses:
        "200":
          description: 配对列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  pairs:
                    type: array
                    items: { $ref: "#/components/schemas/EvalPair" }

  /api/models/versions:
    get:
      tags: [model]
      summary: 模型版本列表
      description: 扫描模型目录，`active` 标记当前 `latest.txt` 指向的版本。采纳即回滚/前滚。
      responses:
        "200":
          description: 版本列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  active: { type: string }
                  versions:
                    type: array
                    items: { $ref: "#/components/schemas/ModelVersion" }

  /api/models/adopt:
    post:
      tags: [model]
      summary: 采纳某个模型版本
      description: |
        先把目标版本 `load_bundle()` 一遍验证可加载，再改写 `latest.txt` 指针，
        然后立刻用新模型跑一轮预测并推送。**验证失败不切换** —— 坏模型上线比不准的模型危险。
      parameters:
        - name: version
          in: query
          required: true
          schema: { type: string, example: v20261021-050212 }
      responses:
        "200":
          description: 已采纳
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  active: { type: string }
        "404":
          $ref: "#/components/responses/NotFound"

  /api/retrain:
    post:
      tags: [model]
      summary: 触发重训
      description: 异步提交，立即返回。训练约 90 秒，期间旧模型继续服务。用 `/retrain/status` 轮询。
      responses:
        "200":
          description: 已提交
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  status: { type: string }
        "409":
          description: 已有训练在跑
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/retrain/status:
    get:
      tags: [model]
      summary: 重训状态
      responses:
        "200":
          description: 状态
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetrainStatus" }

  # ============================================================== rules
  /api/rules:
    get:
      tags: [rules]
      summary: 读取研判规则
      responses:
        "200":
          description: 当前规则
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rules" }
    put:
      tags: [rules]
      summary: 保存研判规则（热更新）
      description: |
        合并进 `rules.json` 后立刻生效，下一轮研判即用新规则，不需要重训。
        子字典（`weights`/`min_duration_min`/`score_cutoffs`）**逐键合并**，
        不是整块替换 —— 整块替换会把没提到的等级静默抹掉。

        **改之前应该先调 `/rules/preview` 看影响。**
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RulesPatch" }
      responses:
        "200":
          description: 已生效
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rules" }

  /api/rules/preview:
    post:
      tags: [rules]
      summary: 规则影响预演
      description: |
        用**同一条已发布的预测曲线**重判 before/after，不重新预测 ——
        否则变化里混着模型噪声，分不清是规则改的还是这一轮雨变了。

        尚无预测结果时返回 409，而不是空列表（空列表会被读成「改了没影响」）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RulesPatch" }
      responses:
        "200":
          description: 逐站点影响
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RulesImpact" }
        "409":
          $ref: "#/components/responses/Conflict"

  # ============================================================== auth
  /api/auth/login:
    post:
      tags: [auth]
      summary: 登录
      description: 成功返回 HttpOnly + SameSite=Strict 的会话 Cookie，并落一条审计。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  expires_at: { type: integer }
        "401":
          description: 口令错误（不区分「用户不存在」与「口令错」，避免枚举）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/auth/logout:
    post:
      tags: [auth]
      summary: 退出登录
      responses:
        "200":
          description: 已退出
          content:
            application/json:
              schema:
                type: object
                properties: { ok: { type: boolean } }

  /api/auth/me:
    get:
      tags: [auth]
      summary: 当前会话用户
      responses:
        "200":
          description: 当前用户与权限
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401":
          description: 未登录
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/users:
    get:
      tags: [auth]
      summary: 用户列表（需 admin）
      responses:
        "200":
          description: 用户列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items: { $ref: "#/components/schemas/User" }
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [auth]
      summary: 新建用户（需 admin）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, role]
              properties:
                username: { type: string }
                password: { type: string, format: password }
                display_name: { type: string }
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "200":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }

  /api/users/{username}:
    patch:
      tags: [auth]
      summary: 改角色 / 停用（需 admin）
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { $ref: "#/components/schemas/Role" }
                active: { type: boolean }
                display_name: { type: string }
                password: { type: string, format: password }
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }

  # ============================================================== audit
  /api/audit:
    get:
      tags: [audit]
      summary: 操作审计日志
      description: |
        所有写操作（POST/PUT/PATCH/DELETE）由中间件自动落库，包括失败的那些 ——
        失败的写操作恰恰是最需要查的。只读接口不记。
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 100, maximum: 1000 }
        - name: actor
          in: query
          schema: { type: string }
        - name: action
          in: query
          description: 按动作前缀过滤，如 `alert` 匹配 `/api/alerts/*` 的写操作
          schema: { type: string }
        - name: since
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: 审计记录（倒序）
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/AuditEntry" }

  # ============================================================== notify
  /api/notify/channels:
    get:
      tags: [notify]
      summary: 通知渠道配置
      description: 密钥类字段返回时打码，只保留末 4 位。
      responses:
        "200":
          description: 渠道列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  channels:
                    type: array
                    items: { $ref: "#/components/schemas/NotifyChannel" }
    put:
      tags: [notify]
      summary: 更新通知渠道（需 admin）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/NotifyChannel" }
      responses:
        "200":
          description: 已保存
          content:
            application/json:
              schema:
                type: object
                properties: { ok: { type: boolean } }

  /api/notify/deliveries:
    get:
      tags: [notify]
      summary: 最近投递记录
      description: 每次预警触发/升级尝试投递都记一条，含失败原因。用于回答「为什么我没收到」。
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: 投递记录
          content:
            application/json:
              schema:
                type: object
                properties:
                  deliveries:
                    type: array
                    items: { $ref: "#/components/schemas/Delivery" }

  /api/notify/test:
    post:
      tags: [notify]
      summary: 发送测试消息（需 admin）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                channel: { type: string, example: webhook }
      responses:
        "200":
          description: 投递结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Delivery" }

  # ============================================================== sim
  /api/sim/storm:
    post:
      tags: [sim]
      summary: 注入一场暴雨（演练）
      description: |
        往模拟器未来窗口里塞一场降雨过程。60 倍速下 150 分钟仿真雨在 2.5 分钟墙钟内下完，
        注入后立刻轮询 `/overview` 会看到等级逐级上升。

        **生产环境应整段删除这个路由。**
      parameters:
        - name: peak
          in: query
          description: 峰值雨强（毫米/小时）
          schema: { type: number, default: 90, minimum: 3, maximum: 300 }
        - name: dur
          in: query
          description: 持续步数（每步 5 分钟）
          schema: { type: integer, default: 24, minimum: 6, maximum: 96 }
      responses:
        "200":
          description: 注入结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  storm:
                    type: object
                    properties:
                      start_step: { type: integer }
                      dur_steps: { type: integer }
                      peak_mm_h: { type: number }
                      sim_minutes: { type: integer }

  /api/sim/reset-water:
    post:
      tags: [sim]
      summary: 排空积水（演练）
      description: |
        把水位清零、把特征缓冲重写成「这座城市从没下过雨」，并**作废所有未结算预测**。

        为什么需要它：模拟器的退水极慢（管网满负荷、有漫溢拓宽，实测从 0.7 米退到
        0.45 米要 11 小时仿真时间），演练等不到预警解除。作废未结算预测是因为那些预测
        瞄准的是被抹掉的洪水曲线，留着结算会把在线 skill 抬成假数字。

        **生产环境应整段删除这个路由。**
      parameters:
        - name: clear_sky
          in: query
          schema: { type: boolean, default: true }
      responses:
        "200":
          description: 已清零
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  sites: { type: integer }
                  clear_sky: { type: boolean }
                  dropped_pending: { type: integer, description: 作废的未结算预测条数 }

  # ============================================================== ingest
  /api/ingest/telemetry:
    post:
      tags: [ingest]
      summary: 写入遥测
      description: |
        引擎每 tick 推一次（10 站点 × 1 个时刻）。外部真实数据源接入时改成往这里推即可，
        其余全部链路不用改。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TelemetryBatch" }
      responses:
        "200":
          description: 已写入
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  rows: { type: integer }

  /api/ingest/forecast:
    post:
      tags: [ingest]
      summary: 发布一轮预测
      description: |
        存快照 → 落决策日志 → 逐站点推进四态机 → 广播 SSE。四态迁移与通知投递都在这一步发生。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForecastPayload" }
      responses:
        "200":
          description: 已发布
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  sites: { type: integer }
                  warnings:
                    type: array
                    items:
                      type: object
                      properties:
                        site_id: { type: string }
                        action: { type: string, enum: [raised, upgraded, updated, cleared, none] }

  # ============================================================== icm
  /api/icm/health:
    get:
      tags: [icm]
      summary: ICM 集成适配网关健康度
      description: |
        外部真实数据源（黄岩区城市内涝基础平台 / Infovision iCM）的接入网关健康快照。

        **需登录**（任何已登录角色即可读）。放在只读段而不是公开段：快照里带着
        对方地址、接入点、映射告警等内部集成状态，属于内部信息。

        网关未启用（未配置 `WL_ICM_BASE_URL`）时同样返回 **200**，
        `status` 为 `not_enabled` —— 不是 404。端点本身一直在，只是能力没开；
        返回 404 会让前端误判成「这个接口不存在」。

        `status` 三态：
        - `not_enabled`：网关未启用
        - `ok`：最近一次同步成功
        - `degraded`：最近一次同步失败，已进入退避重试
      responses:
        "200":
          description: 网关健康快照（未启用时 status=not_enabled）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ICMHealth"
                  - type: object
                    required: [status, message]
                    properties:
                      status:
                        type: string
                        enum: [not_enabled, ok, degraded]
                      message: { type: string, description: 状态说明，可直接展示 }
        "401":
          description: 未登录
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ============================================================== aiwater
  # AI 平台自研网关：/api/aiwater/v1/*
  #
  # 这一组与本文件其余部分**不是同一套契约**，别混用：
  #   本文件其余部分：成功=裸 JSON，失败={"error":"中文原话"}，字段 snake_case
  #   本组：          成功/失败都={"code":"0"|"<错误码>","msg":"...","data":{...}|null}
  #                   code 是**字符串**，字段 camelCase，分页壳 {total,pageNo,pageSize,list}
  #
  # 两套都是已上线的对外契约：v3 原生那套被 9 个前端页面依赖，
  # 网关那套是对方平台（ICM / AI 水位预测及预警平台）的对接要求。
  # 所以网关自己写了一套响应出口，不去改 writeJSON / fail。
  /api/aiwater/v1/prediction/result:
    post:
      tags: [aiwater]
      summary: "A-1 水位趋势预测结果查询"
      description: |
        返回最近一轮预测快照中，各点位在各预见期上的预测结果。

        **时间口径**：v3 跑的是 60 倍加速仿真时钟，响应里的 `data.timeBasis`
        恒为 `simulated`，`data.issuedAt` 是仿真时钟秒、`data.wallClock` 是真实墙钟秒。
        对方按真实时间对齐时用 `wallClock`；把 `issuedAt` 当真实采集时间会让整条时序链路失真。

        `beginTime` / `endTime` 按**预测目标时刻**（`predictTime`）过滤。
        本接口返回的是最近一轮快照，不是历史归档查询——历史走 v3 原生的
        `/api/eval/pairs` 与 `/api/sites/{id}/history`。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                pointCode: { type: string, description: 单点位编码 }
                pointCodes:
                  type: array
                  items: { type: string }
                  description: 多点位编码；与 pointCode 二选一，均为空时返回全部站点
                period:
                  type: array
                  items: { type: string, enum: ["1h", "3h", "6h", "12h"] }
                  description: 预见期；为空时返回全部四个
                beginTime: { type: integer, description: 预测目标时刻下界（仿真时钟秒） }
                endTime: { type: integer, description: 预测目标时刻上界（仿真时钟秒） }
                pageNo: { type: integer, description: 页码，从 1 起 }
                pageSize: { type: integer, description: 每页条数，默认 20，上限 1000 }
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIWaterPredictionResponse" }
        "400":
          $ref: "#/components/responses/AIWaterBadRequest"
        "401":
          $ref: "#/components/responses/AIWaterUnauthorized"
        "503":
          $ref: "#/components/responses/AIWaterUnavailable"

  /api/aiwater/v1/risk/realtime:
    post:
      tags: [aiwater]
      summary: "A-2 风险等级实时查询"
      description: |
        返回**当前存在预警**的点位的实时风险。

        无风险时返回**空列表**而不是报错——对方按约定用空列表表达「没有风险」，
        报 400 会被他们的 SDK 当成调用失败并重试。

        等级对外是三级（low / medium / high），我方原始四级（blue / yellow / orange / red）
        在扩展字段 `warnLevel` 里保留，信息不因映射而丢失。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                pointCode: { type: string, description: 点位编码 }
                regionIndexCode: { type: string, description: 区域编码（按 district 匹配） }
                level:
                  type: string
                  enum: [low, medium, high]
                  description: 风险等级过滤；同时接受我方四级 blue/yellow/orange/red
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIWaterRiskResponse" }
        "400":
          $ref: "#/components/responses/AIWaterBadRequest"
        "401":
          $ref: "#/components/responses/AIWaterUnauthorized"

  /api/aiwater/v1/warning/records:
    post:
      tags: [aiwater]
      summary: "A-3 预警记录分页查询"
      description: |
        返回 v3 预警事件表的分页结果，按触发时刻倒序。

        `level` 过滤同时接受对外三级（low/medium/high）与我方四级
        （blue/yellow/orange/red）——只认一种的话，对方按自己字典传参会查空。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                regionIndexCode: { type: string, description: 区域编码（按 district 匹配） }
                pointCode: { type: string, description: 点位编码 }
                level: { type: string, description: 等级过滤（三级或四级均可） }
                beginTime: { type: integer, description: 触发时刻下界（仿真时钟秒） }
                endTime: { type: integer, description: 触发时刻上界（仿真时钟秒） }
                status:
                  type: string
                  enum: [active, acknowledged, cleared]
                  description: 预警状态
                pageNo: { type: integer }
                pageSize: { type: integer }
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIWaterAlertPage" }
        "400":
          $ref: "#/components/responses/AIWaterBadRequest"
        "401":
          $ref: "#/components/responses/AIWaterUnauthorized"

  /api/aiwater/v1/config/rainrule:
    post:
      tags: [aiwater]
      summary: "A-4 雨情场景与阈值规则配置查询（只读）"
      description: |
        按「点位 × 等级」展开阈值规则。

        `rainScene` 恒为 `unspecified`：v3 没有雨情场景模型（功能条款 8-1 是留白），
        这里不编枚举值——宁可让对方知道「没有」，也不要给一个看起来像真的值。

        引擎不可达时返回 503（对方会退避重试），不给降级的半份数据。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                pointCode: { type: string }
                deviceType: { type: string, description: 设备类型，目前只有 water_level }
                monitorItemCode: { type: string, description: 监测项，目前只有 water_level }
                rainScene: { type: string, description: 雨情场景；v3 无此模型，匹配不到 }
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIWaterRainRuleResponse" }
        "401":
          $ref: "#/components/responses/AIWaterUnauthorized"
        "503":
          $ref: "#/components/responses/AIWaterUnavailable"

  /api/aiwater/v1/model/versions:
    post:
      tags: [aiwater]
      summary: "A-5 模型版本列表与切换"
      description: |
        `action=list`（默认）：只读，返回可采纳的模型版本清单。

        `action=switch`：**写操作**。必须带 `versionId` 与 `confirm=true`。
        没有 `confirm` 一律 400 —— 切换模型会让所有站点的预测曲线与告警等级当场改变，
        而对方 SDK 的重试逻辑会重复发同一个请求；没有二次确认，
        等于让一次网络抖动变成一次静默的线上变更。
        切换动作会落进既有审计表。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                action: { type: string, enum: [list, switch], default: list }
                taskType: { type: string, description: 任务类型，目前只有 water_level_forecast }
                versionId: { type: string, description: action=switch 时必填 }
                requestId: { type: string, description: 切换请求的幂等键 }
                confirm: { type: boolean, description: action=switch 时必须为 true }
      responses:
        "200":
          description: 查询或切换成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIWaterModelResponse" }
        "400":
          $ref: "#/components/responses/AIWaterBadRequest"
        "401":
          $ref: "#/components/responses/AIWaterUnauthorized"
        "503":
          $ref: "#/components/responses/AIWaterUnavailable"

  /api/aiwater/v1/prediction/task/submit:
    post:
      tags: [aiwater]
      summary: "A-6 预测任务提交（异步）"
      description: |
        提交一个预测任务，立刻返回 `taskId` 与 `status=queued`；结果经
        `/prediction/task/status` 轮询或经 `callbackUrl` 回调获取。

        **`requestId` 必填**：它是幂等键。重复提交同一个 `requestId` 返回**同一个**
        `taskId`，并把 `duplicate` 置为 true。幂等由数据库唯一索引保证，
        不是应用层的「先查再插」——后者在并发下必然有窗口。

        没有 `requestId` 一律 400：否则对方 SDK 重试一次就会开出第二个任务，
        两边看到的任务数对不上。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId]
              properties:
                requestId: { type: string, description: 幂等键，必填 }
                pointCodes:
                  type: array
                  items: { type: string }
                  description: 参与预测的点位；为空表示全部站点
                periods:
                  type: array
                  items: { type: string, enum: ["1h", "3h", "6h", "12h"] }
                beginTime: { type: integer }
                endTime: { type: integer }
                modelVersion: { type: string, description: 指定模型版本；空表示用当前生效版本 }
                callbackUrl: { type: string, description: 完成后回调地址 }
      responses:
        "200":
          description: 提交成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIWaterTaskSubmitResponse" }
        "400":
          $ref: "#/components/responses/AIWaterBadRequest"
        "401":
          $ref: "#/components/responses/AIWaterUnauthorized"
        "503":
          $ref: "#/components/responses/AIWaterUnavailable"

  /api/aiwater/v1/prediction/task/status:
    post:
      tags: [aiwater]
      summary: "A-7 预测任务状态与结果回调查询"
      description: |
        轮询任务状态。`status` 四态：`queued` / `running` / `success` / `failed`。

        失败时 `errorCode` 取值：`INPUT_MISSING`（输入数据缺失）、
        `MODEL_UNAVAILABLE`（模型不可用）、`TIMEOUT`、`QUOTA_EXCEEDED`、`INTERNAL`。

        `resultUrl` 恒为空串：当前实现不落结果文件，结果直接在 `resultList` 里。
        给一个打不开的 URL 会让对方误判成「还在生成」。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [taskId]
              properties:
                taskId: { type: string, description: "也可用 query 参数 ?taskId= 传" }
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIWaterTaskStatusResponse" }
        "400":
          $ref: "#/components/responses/AIWaterBadRequest"
        "401":
          $ref: "#/components/responses/AIWaterUnauthorized"
        "404":
          $ref: "#/components/responses/AIWaterNotFound"

  /api/aiwater/v1/waterlogging/event/lifecycle:
    post:
      tags: [aiwater]
      summary: "A-8 积水事件全生命周期记录查询"
      description: |
        把两处来源按操作时刻归并：

        1. `aiwater_event` 表——A-9 收到的对方事件（发现 / 复核 / 核销 三阶段）；
        2. `warning_event` 表——我方预警四态机派生：升起=发现、确认=复核、解除=核销。

        只给其中一份都会漏掉一半：只给 A-9 的是对方自己的数据（对我方没增量），
        只给预警派生的是我方数据（对方看不到他们推过来的事件）。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                eventId: { type: string }
                pointCode: { type: string }
                beginTime: { type: integer }
                endTime: { type: integer }
                stage: { type: string, enum: [发现, 复核, 核销] }
                pageNo: { type: integer }
                pageSize: { type: integer }
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIWaterLifecyclePage" }
        "400":
          $ref: "#/components/responses/AIWaterBadRequest"
        "401":
          $ref: "#/components/responses/AIWaterUnauthorized"

  /api/aiwater/v1/event/receive:
    post:
      tags: [aiwater]
      summary: "A-9 平台事件接收（订阅回调）"
      description: |
        对方平台推给我方的入站回调。**免平台 Token**（对方不会带它自己的 accessToken），
        靠共享密钥验签。

        **验签**：请求头 `X-AIWater-Signature` 携带
        `HMAC-SHA256(WL_AIWATER_EVENT_SECRET, 原始报文体)` 的十六进制值
        （可带 `sha256=` 前缀）。未配置密钥时放行，但响应里 `signatureVerified=false`。

        **幂等**：主键是 `(eventId, stage)`。同一事件的同一阶段重复推送只留一条；
        同一事件的不同阶段都要留——那正是「全生命周期」的含义。

        **必须返回 HTTP 200**：对方平台按状态码判定投递是否成功，
        非 200 会触发它的重试。同一个事件被反复推几十次，幂等表虽然能挡住重复入库，
        但对方的重试队列会把本接口打满。所以验签失败、报文非法也一律回 200，
        失败信息放在响应包的 `msg` 里（那是给对方业务侧看的）。
      security: []
      parameters:
        - name: X-AIWater-Signature
          in: header
          required: false
          schema: { type: string }
          description: "HMAC-SHA256 十六进制摘要；未配置密钥时可不带"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                eventId: { type: string, description: 事件标识；缺失则该条被丢弃 }
                pointCode: { type: string }
                stage: { type: string, enum: [发现, 复核, 核销] }
                operator: { type: string }
                operateTime:
                  oneOf:
                    - { type: string, description: "ISO 8601，如 2026-11-10T10:00:00.000+08:00" }
                    - { type: integer, description: Unix 秒（或毫秒） }
                conclusion: { type: string }
                evidenceUrls:
                  type: array
                  items: { type: string }
            description: 单个事件对象、事件数组、或 {list:[...]} / {events:[...]} / {data:[...]} 包装都收
      responses:
        "200":
          description: |
            恒为 200。`data.accepted` 是本次真正写入的条数，
            `data.duplicate` 是幂等命中的条数。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIWaterEventResultResponse" }

  # ============================================================== stream
  /api/events:
    get:
      tags: [system]
      summary: SSE 事件流
      description: |
        事件名：`hello` / `telemetry` / `forecast` / `warning` / `rules` / `audit`。

        前端只开**一条**连接（模块级单例），因为同源并发长连接上限是 6 条。
        收到事件后按 `queryKey` 节流 800ms 再失效缓存，否则每 5 秒一次的遥测
        会让整个页面重渲染。

        nginx 前置时必须 `proxy_buffering off`，否则事件被攒着不发。
      responses:
        "200":
          description: text/event-stream
          content:
            text/event-stream:
              schema:
                type: string

components:
  parameters:
    SiteId:
      name: siteId
      in: path
      required: true
      schema: { type: string, example: S01 }
    AlertId:
      name: id
      in: path
      required: true
      schema: { type: integer }

  responses:
    NotFound:
      description: 不存在
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: 业务冲突（文案可直接展示给值班员）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: 权限不足
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AIWaterBadRequest:
      description: 参数错误（网关响应包，code="400"）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AIWaterEnvelope" }
    AIWaterUnauthorized:
      description: 网关令牌无效（网关响应包，code="401"）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AIWaterEnvelope" }
    AIWaterNotFound:
      description: 资源不存在（网关响应包，code="404"）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AIWaterEnvelope" }
    AIWaterUnavailable:
      description: |
        服务不可用（引擎不可达 / 算力满 / 预测尚未生成），网关响应包 code="503"。
        对方 SDK 会按 503 退避重试；前端应显示「预测滞后」而非空白。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AIWaterEnvelope" }

  schemas:
    AIWaterEnvelope:
      type: object
      description: |
        网关统一响应包。成功与失败都用这个壳，区别在 `code`：
        成功是字符串 `"0"`，失败是字符串错误码（`"400"` / `"401"` / `"404"` / `"500"` / `"503"`）。

        `data` 在失败时写 `null` 而不是省略字段——对方按固定结构解析，
        字段缺失与字段为 null 是两回事。
      required: [code, msg, data]
      properties:
        code:
          type: string
          description: "成功为 \"0\"；失败为字符串错误码"
          examples: ["0", "400", "401", "404", "500", "503"]
        msg: { type: string, description: 可直接展示的中文文案 }
        data: { description: 业务数据；失败时为 null }

    AIWaterTimeMeta:
      type: object
      description: |
        时间标注。v3 内部跑 60 倍加速仿真时钟，对方平台用真实时间，
        不标注的话对方会把仿真时间当真实采集时间去算时序与时效，整条链路就废了。
      properties:
        timeBasis:
          type: string
          enum: [simulated, real]
          description: 时间基准；当前恒为 simulated
        issuedAt: { type: integer, description: 仿真时钟秒（60 倍速） }
        wallClock: { type: integer, description: 真实墙钟秒（Unix），对方按真实时间对齐用这个 }

    AIWaterPage:
      type: object
      description: 网关统一分页壳
      required: [total, pageNo, pageSize, list]
      properties:
        total: { type: integer, description: 满足条件的总条数 }
        pageNo: { type: integer, description: 页码，从 1 起 }
        pageSize: { type: integer, description: 每页条数，默认 20，上限 1000 }
        list: { type: array, items: {} }

    AIWaterPrediction:
      type: object
      required: [pointCode, period, predictTime, predictLevel, riskLevel, confidence, modelVersion, revision, correctionId]
      properties:
        pointCode: { type: string, description: 点位编码 }
        period: { type: string, enum: ["1h", "3h", "6h", "12h"] }
        predictTime: { type: integer, description: 预测目标时刻（仿真时钟秒） }
        predictLevel: { type: number, description: 预测水位（米，绝对高程） }
        riskLevel: { type: string, enum: [low, medium, high] }
        confidence:
          type: number
          description: 由置信带相对宽度换算的 0~1 置信度（1 / (1 + 1.6449·σ/|水位|)）
        modelVersion: { type: string }
        revision:
          type: number
          description: 修正**前**的预测水位；与 predictLevel 同时保留是为了可复盘「改了多少」
        correctionId:
          type: string
          description: "修正记录标识 {pointCode}:{period}:{modelVersion}，幂等键；不掺发布时刻"
      additionalProperties: true
      description: |
        扩展字段（我方原始口径，保留以免信息在映射中丢失）：
        `warnLevel`（blue/yellow/orange/red/none）、`lower` / `upper`（置信带）、
        `sigma`、`correction`（本次修正量）、`gain`、`reason`。

    AIWaterPredictionResponse:
      allOf:
        - $ref: "#/components/schemas/AIWaterEnvelope"
        - type: object
          properties:
            data:
              allOf:
                - $ref: "#/components/schemas/AIWaterPage"
                - $ref: "#/components/schemas/AIWaterTimeMeta"
                - type: object
                  properties:
                    list:
                      type: array
                      items: { $ref: "#/components/schemas/AIWaterPrediction" }
                    modelVersion: { type: string }

    AIWaterRiskSite:
      type: object
      required: [pointCode, riskLevel, currentLevel, predictLevel, riskTime, ruleId, rainScene, appliedThreshold]
      properties:
        pointCode: { type: string }
        riskLevel: { type: string, enum: [low, medium, high] }
        currentLevel: { type: number, description: 当前实测水位（米） }
        predictLevel: { type: number, description: 预测峰值水位（米） }
        riskTime: { type: integer, description: 风险判定时刻（仿真时钟秒） }
        ruleID: { type: string, description: 命中的规则标识 }
        ruleId: { type: string, description: 命中的规则标识 }
        rainScene:
          type: string
          description: 雨情场景；v3 无此模型（条款 8-1 留白），恒为 unspecified
        appliedThreshold: { type: number, description: 本次适用的阈值（绝对高程，米） }
      additionalProperties: true
      description: |
        扩展字段：`warnLevel`、`siteName`、`district`、`warnScore`、`durationMin`、
        `slopeMH`、`reason`。

    AIWaterRiskResponse:
      allOf:
        - $ref: "#/components/schemas/AIWaterEnvelope"
        - type: object
          properties:
            data:
              allOf:
                - $ref: "#/components/schemas/AIWaterTimeMeta"
                - type: object
                  properties:
                    total: { type: integer }
                    list:
                      type: array
                      items: { $ref: "#/components/schemas/AIWaterRiskSite" }

    AIWaterAlertRecord:
      type: object
      required: [warningId, pointCode, level, triggerValue, threshold, rainScene, triggerTime, status, eventId]
      properties:
        warningId: { type: string }
        pointCode: { type: string }
        level: { type: string, enum: [low, medium, high], description: 对外三级预警等级 }
        triggerValue: { type: number, description: 触发时的水位值（米） }
        threshold: { type: number, description: 适用的阈值（绝对高程，米） }
        rainScene: { type: string, description: 恒为 unspecified }
        triggerTime: { type: integer, description: 触发时刻（仿真时钟秒） }
        status: { type: string, enum: [active, acknowledged, cleared] }
        eventId: { type: string, description: 与 A-8 生命周期记录串联的标识 }
      additionalProperties: true
      description: |
        扩展字段：`warnLevel`（原始四级）、`state`（我方四态机原始状态）、
        `siteName`、`district`、`score`、`durationMin`、`slopeMH`、`reason`、
        `assignee`、`disposition`、`ackedAt`、`clearedAt`。

    AIWaterAlertPage:
      allOf:
        - $ref: "#/components/schemas/AIWaterEnvelope"
        - type: object
          properties:
            data:
              allOf:
                - $ref: "#/components/schemas/AIWaterPage"
                - $ref: "#/components/schemas/AIWaterTimeMeta"
                - type: object
                  properties:
                    list:
                      type: array
                      items: { $ref: "#/components/schemas/AIWaterAlertRecord" }

    AIWaterRainRule:
      type: object
      required: [ruleId, pointCode, monitorItemCode, rainScene, thresholdUpper, thresholdLower, level, enabled, effectTime, version]
      properties:
        ruleId: { type: string }
        pointCode: { type: string }
        monitorItemCode: { type: string, description: 监测项编码，目前只有 water_level }
        rainScene: { type: string, description: 恒为 unspecified }
        thresholdUpper: { type: number, description: 阈值上界（绝对高程，米） }
        thresholdLower: { type: number, description: 阈值下界（绝对高程，米） }
        level: { type: string, enum: [blue, yellow, orange, red] }
        enabled: { type: boolean }
        effectTime: { type: integer, description: 生效时刻（仿真时钟秒） }
        version: { type: string, description: 规则版本，如 rules-1.0 }
      additionalProperties: true

    AIWaterRainRuleResponse:
      allOf:
        - $ref: "#/components/schemas/AIWaterEnvelope"
        - type: object
          properties:
            data:
              allOf:
                - $ref: "#/components/schemas/AIWaterTimeMeta"
                - type: object
                  properties:
                    total: { type: integer }
                    version: { type: string }
                    list:
                      type: array
                      items: { $ref: "#/components/schemas/AIWaterRainRule" }

    AIWaterModelVersion:
      type: object
      required: [versionId, versionName, taskType, deployTime, status]
      properties:
        versionId: { type: string }
        versionName: { type: string }
        taskType: { type: string, description: 目前只有 water_level_forecast }
        deployTime: { type: integer, description: 部署时刻（Unix 秒） }
        status: { type: string, enum: [active, idle] }
      additionalProperties: true
      description: |
        扩展字段：`active`、`rmse3h`、`skill3h`、`folds`、`trainSeconds`、`sizeMb`。

    AIWaterModelResponse:
      allOf:
        - $ref: "#/components/schemas/AIWaterEnvelope"
        - type: object
          properties:
            data:
              allOf:
                - $ref: "#/components/schemas/AIWaterTimeMeta"
                - type: object
                  properties:
                    total: { type: integer }
                    activeVersion: { type: string }
                    effectiveTime: { type: integer, description: 切换生效时刻（仅 action=switch） }
                    list:
                      type: array
                      items: { $ref: "#/components/schemas/AIWaterModelVersion" }

    AIWaterTaskSubmitResponse:
      allOf:
        - $ref: "#/components/schemas/AIWaterEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [taskId, submitTime, status, duplicate]
              properties:
                taskId: { type: string }
                submitTime: { type: integer, description: 提交时刻（墙钟 Unix 秒） }
                status: { type: string, enum: [queued, running, success, failed] }
                duplicate:
                  type: boolean
                  description: 是否命中 requestId 幂等（true = 此前已提交，返回同一个任务）

    AIWaterTaskStatusResponse:
      allOf:
        - $ref: "#/components/schemas/AIWaterEnvelope"
        - type: object
          properties:
            data:
              allOf:
                - $ref: "#/components/schemas/AIWaterTimeMeta"
                - type: object
                  properties:
                    taskId: { type: string }
                    status: { type: string, enum: [queued, running, success, failed] }
                    progress: { type: integer, description: 进度百分比 0~100 }
                    errorCode:
                      type: string
                      enum: [INPUT_MISSING, MODEL_UNAVAILABLE, TIMEOUT, QUOTA_EXCEEDED, INTERNAL]
                    errorMsg: { type: string }
                    resultUrl:
                      type: string
                      description: 恒为空串；结果直接放在 resultList 里
                    resultList:
                      type: array
                      items: { $ref: "#/components/schemas/AIWaterPrediction" }
                    callbackStatus: { type: string, enum: [ok, failed, skipped] }
                    callbackMsg: { type: string }
                    submitTime: { type: integer }
                    updateTime: { type: integer }

    AIWaterLifecycleRecord:
      type: object
      required: [eventId, pointCode, stage, operator, operateTime, conclusion, evidenceUrls]
      properties:
        eventId: { type: string }
        pointCode: { type: string }
        stage: { type: string, enum: [发现, 复核, 核销] }
        operator: { type: string }
        operateTime: { type: integer, description: 操作时刻（Unix 秒） }
        conclusion: { type: string }
        evidenceUrls:
          type: array
          items: { type: string }
      additionalProperties: true
      description: "扩展字段：`source`（icm / local）、`siteName`、`district`"

    AIWaterLifecyclePage:
      allOf:
        - $ref: "#/components/schemas/AIWaterEnvelope"
        - type: object
          properties:
            data:
              allOf:
                - $ref: "#/components/schemas/AIWaterPage"
                - $ref: "#/components/schemas/AIWaterTimeMeta"
                - type: object
                  properties:
                    list:
                      type: array
                      items: { $ref: "#/components/schemas/AIWaterLifecycleRecord" }

    AIWaterEventResult:
      type: object
      required: [accepted, duplicate, signatureVerified, eventIds, receivedAt]
      properties:
        accepted: { type: integer, description: 本次真正写入的事件条数 }
        duplicate: { type: integer, description: 幂等命中的条数 }
        signatureVerified: { type: boolean, description: 验签是否通过 }
        eventIds:
          type: array
          items: { type: string }
        receivedAt: { type: integer, description: 收到时刻（墙钟 Unix 秒） }

    AIWaterEventResultResponse:
      allOf:
        - $ref: "#/components/schemas/AIWaterEnvelope"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/AIWaterEventResult" }

    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, example: 已确认，无需重复确认 }

    Level:
      type: string
      enum: [none, blue, yellow, orange, red]
      description: 预警等级。`none` 表示未达蓝色阈值。

    WarnState:
      type: string
      enum: [ACTIVE_UNACK, ACTIVE_ACK, CLEARED_UNACK, CLEARED_ACK]
      description: 阅读轴四态。由模型驱动，人只能 ack。

    Disposition:
      type: string
      enum: [open, dispatched, onsite, resolved, false_alarm]
      description: 处置轴五态。由人驱动。

    Role:
      type: string
      enum: [admin, operator, viewer]
      description: |
        - `admin`：全部权限，含用户管理、规则、模型采纳、通知配置
        - `operator`：可 ack、派单、推进处置、写备注、触发演练；不可改规则/用户/模型
        - `viewer`：只读

    Thresholds:
      type: object
      description: 四级积水深阈值（米，相对站点基准）。改它需要重训，因为它参与特征工程。
      required: [blue, yellow, orange, red]
      properties:
        blue: { type: number, example: 0.06 }
        yellow: { type: number, example: 0.18 }
        orange: { type: number, example: 0.30 }
        red: { type: number, example: 0.46 }

    Site:
      type: object
      properties:
        site_id: { type: string, example: S01 }
        name: { type: string, example: 解放路下穿隧道 }
        district: { type: string, example: 城关区 }
        lon: { type: number }
        lat: { type: number }
        base_level: { type: number, description: 站点基准高程（米）, example: 7.85 }
        thresholds: { $ref: "#/components/schemas/Thresholds" }
        kind:
          type: string
          description: 站点类型，决定该站点最典型的致灾形态
          enum: [underpass, interchange, lowland, riverside, industrial, alley, plaza, culvert, campus, channel]
        catchment_ha: { type: number, description: 汇水面积（公顷） }
        pond_ha: { type: number, description: 蓄水面积（公顷） }
        impervious: { type: number, description: 不透水率 0~1 }
        drainage_mm_h: { type: number, description: 管网排水能力（毫米/小时） }

    TelemetryRow:
      type: object
      properties:
        ts: { type: integer }
        site_id: { type: string }
        level: { type: number, description: 绝对水位（米） }
        rain: { type: number, description: 实测雨强（毫米/小时） }
        quality: { type: number, description: "0~1，<0.7 表示传感器可疑" }
        rain_fc_1h: { type: number, description: 未来 1 小时累计雨量（毫米） }
        rain_fc_3h: { type: number, description: 未来 3 小时累计雨量（毫米） }

    TelemetryBatch:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          items: { $ref: "#/components/schemas/TelemetryRow" }

    ICMHealth:
      type: object
      description: ICM 集成适配网关的健康快照（字段与 internal/icm.HealthStatus 一一对应）。
      required: [enabled, intervalSec, totalRuns, totalFailures, consecutiveFails, degraded]
      properties:
        enabled: { type: boolean, description: 是否配置了对方地址（WL_ICM_BASE_URL） }
        intervalSec: { type: integer, description: 当前生效的同步间隔（秒，含退避） }
        totalRuns: { type: integer, description: 累计执行次数 }
        totalFailures: { type: integer, description: 累计失败次数 }
        consecutiveFails: { type: integer, description: 当前连续失败次数，成功一次即归零 }
        degraded: { type: boolean, description: 是否处于降级状态（连续失败 ≥ 1） }
        lastRunAt: { type: integer, description: 最近一次执行时刻（Unix 秒，真实时间轴） }
        lastSuccessAt: { type: integer, description: 最近一次成功时刻（Unix 秒）；从未成功为 0 }
        lastError:
          type: string
          description: |
            最近一次失败原因。**成功之后也不清空** —— 它回答「上一次为什么失败」，
            而不是「现在有没有错」（后者由 degraded / consecutiveFails 回答）。
        lastRows: { type: integer, description: 最近一次成功写入的行数 }
        lastReport:
          nullable: true
          type: object
          description: 最近一次执行的完整报告
          properties:
            source: { type: string, example: "icm:R1/realtime" }
            ingestUrl: { type: string, description: 写入端点（dry-run 时并不会被调用） }
            dryRun: { type: boolean, description: 是否只报告不写库 }
            pushedRows: { type: integer, description: 实际写入行数（dry-run 时恒为 0） }
            wouldPush: { type: integer, description: 本应写入的行数 }
            warnings:
              type: array
              items: { type: string }
            map:
              type: object
              properties:
                input: { type: integer }
                output: { type: integer }
                skipped_no_site_id: { type: integer }
                skipped_bad_time: { type: integer }
                skipped_no_value: { type: integer }
                timeBasis: { type: string, enum: [real, simulated] }
                warnings:
                  type: array
                  items: { type: string }

    Factors:
      type: object
      description: |
        三因子明细。`*_norm` 是归一化到 0~1.5 的因子得分，
        `score` 是按权重加权后的综合分（0~1+）。
      properties:
        peak: { type: number, description: 峰值因子的原始值（米，积水深） }
        duration: { type: number, description: 超阈持续（分钟） }
        trend: { type: number, description: 1 小时变化率（米/小时） }
        peak_norm: { type: number }
        duration_norm: { type: number }
        trend_norm: { type: number }
        score: { type: number }

    Horizon:
      type: object
      description: 单个预见期的点预测与区间
      properties:
        horizon_min: { type: integer, enum: [60, 180, 360, 720] }
        level: { type: number, description: 预测绝对水位（已含修正与物理钳制） }
        lower: { type: number, description: 90% 区间下界 }
        upper: { type: number, description: 90% 区间上界 }
        delta: { type: number, description: 相对当前水位的增量（含修正） }
        delta_raw: { type: number, description: 模型原始增量（未修正） }
        corrected: { type: number, description: 滚动修正量，已钳制在 ±3σ }
        gain: { type: number, description: 修正增益 0~0.6 }
        sigma: { type: number, description: 该站点该预见期的残差标准差 }
        model: { type: string, description: 实际使用的模型族 }
        reason: { type: string }

    Warning:
      type: object
      properties:
        level: { $ref: "#/components/schemas/Level" }
        score: { type: number }
        factors: { $ref: "#/components/schemas/Factors" }
        peak_level: { $ref: "#/components/schemas/Level" }
        peak_value: { type: number, description: 峰值积水深（米） }
        peak_min: { type: integer, description: 峰值出现的分钟偏移 }
        peak_at_min: { type: integer, nullable: true }
        duration_min: { type: integer, description: 超阈持续分钟数 }
        slope_mh: { type: number, description: 当前趋势（米/小时） }
        reason: { type: string, description: 研判依据原话，直接展示给值班员 }
        blocked_by: { type: string, nullable: true, description: 被哪道硬约束压制 }
        thresholds: { type: array, items: { type: number } }
        horizon_min: { type: integer, description: 研判窗口（分钟） }

    Decision:
      type: object
      description: 智能体值班决策。它不是对话机器人，是每个站点每轮的一次「要不要加算」判断。
      properties:
        should_forecast: { type: boolean }
        model: { type: string }
        gain: { type: number }
        reason: { type: string }
        signals: { type: object, additionalProperties: true }

    SiteForecast:
      type: object
      properties:
        site_id: { type: string }
        now_level: { type: number }
        horizons:
          type: array
          items: { $ref: "#/components/schemas/Horizon" }
        curve:
          type: array
          description: 5 分钟分辨率加密曲线，每项 [offset_min, level, lower, upper]
          items:
            type: array
            items: { type: number }
        warning: { $ref: "#/components/schemas/Warning" }
        decision: { $ref: "#/components/schemas/Decision" }

    ForecastPayload:
      type: object
      properties:
        issued_at: { type: integer }
        model_version: { type: string }
        step_min: { type: integer }
        sites:
          type: object
          additionalProperties: { $ref: "#/components/schemas/SiteForecast" }

    OverviewSite:
      type: object
      description: 一张图一行。静态属性 + 实时遥测 + 派生量 + 研判合并。
      properties:
        site_id: { type: string }
        name: { type: string }
        district: { type: string }
        lon: { type: number }
        lat: { type: number }
        base_level: { type: number }
        thresholds: { type: array, items: { type: number } }
        kind: { type: string }
        level: { type: number, description: 实测绝对水位 }
        depth: { type: number, description: 积水深（后端算好，前端不要重算） }
        rain: { type: number }
        quality: { type: number }
        trend_1h: { type: number, description: 米/小时 }
        warn_level: { $ref: "#/components/schemas/Level" }
        warn_score: { type: number }
        peak_level: { $ref: "#/components/schemas/Level" }
        peak_value: { type: number }
        peak_at_min: { type: integer, nullable: true }
        duration_min: { type: integer }
        slope_mh: { type: number }
        horizon_min: { type: integer }
        reason: { type: string }
        factors: { $ref: "#/components/schemas/Factors" }
        spark:
          type: array
          description: 近 3 小时抽稀后的水位序列，用于画迷你趋势
          items: { type: number }
        updated_at: { type: integer }

    AlertEvent:
      type: object
      properties:
        id: { type: integer }
        site_id: { type: string }
        site_name: { type: string }
        level: { $ref: "#/components/schemas/Level" }
        score: { type: number }
        peak_value: { type: number }
        peak_at_min: { type: integer, nullable: true }
        duration_min: { type: integer }
        slope_mh: { type: number }
        reason: { type: string }
        state: { $ref: "#/components/schemas/WarnState" }
        disposition: { $ref: "#/components/schemas/Disposition" }
        assignee: { type: string }
        note_count: { type: integer }
        raised_at: { type: integer }
        acked_at: { type: integer, nullable: true }
        cleared_at: { type: integer, nullable: true }
        updated_at: { type: integer }

    AlertNote:
      type: object
      properties:
        id: { type: integer }
        alert_id: { type: integer }
        at: { type: integer }
        author: { type: string }
        kind: { type: string, enum: [note, dispatch, status] }
        text: { type: string }

    MetricRow:
      type: object
      properties:
        model: { type: string, enum: [persistence, linear, gbr, blend] }
        horizon_min: { type: integer }
        rmse: { type: number }
        mae: { type: number }
        mape: { type: number }
        nse: { type: number }
        skill: { type: number, description: 相对持久化基线的技能分 }
        crps: { type: number }
        picp90: { type: number, description: "区间覆盖率，**比例**（0.924 表示 92.4%），理想 0.9" }
        pinaw: { type: number, description: 区间平均宽度（米），越小越锐 }
        event_n: { type: number, description: 事件样本数 }
        event_rmse: { type: number }
        event_skill: { type: number }

    MetricsBundle:
      type: object
      properties:
        version: { type: string }
        trained_at: { type: integer }
        n_train: { type: integer }
        n_valid: { type: integer }
        n_features: { type: integer }
        train_seconds: { type: number }
        folds: { type: integer }
        metrics:
          type: object
          description: 模型族 → 指标行数组
          additionalProperties:
            type: array
            items: { $ref: "#/components/schemas/MetricRow" }
        weights:
          type: object
          description: 预见期 → 站点 → 融合权重（1.0 表示完全信任 GBR，<1 表示向持久化基线回退）
          additionalProperties:
            type: object
            additionalProperties: { type: number }
        feature_importance:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              importance: { type: number }

    RollingStat:
      type: object
      description: 在线滚动评估。`skill` 的分母是持久化基线（发布时的实测水位），不是实际值标准差。
      properties:
        n: { type: integer }
        rmse: { type: number }
        mae: { type: number }
        bias: { type: number }
        p95_abs: { type: number }
        baseline_rmse: { type: number }
        skill: { type: number }

    MetricsResp:
      type: object
      properties:
        latest: { $ref: "#/components/schemas/MetricsBundle" }
        history:
          type: array
          items:
            type: object
            properties:
              version: { type: string }
              trained_at: { type: integer }
              rmse_3h: { type: number }
              skill_3h: { type: number }
        rolling:
          type: object
          description: 预见期（字符串键）→ 滚动统计
          additionalProperties: { $ref: "#/components/schemas/RollingStat" }
        rolling_window_h: { type: integer }

    DecisionRow:
      type: object
      properties:
        ts: { type: integer }
        site_id: { type: string }
        should_forecast: { type: boolean }
        model: { type: string }
        correction_gain: { type: number }
        reason: { type: string }
        signals: { type: object, additionalProperties: true }

    EvalPair:
      type: object
      properties:
        site_id: { type: string }
        horizon_min: { type: integer }
        issued_at: { type: integer }
        target_at: { type: integer }
        yhat: { type: number }
        actual: { type: number, nullable: true }
        origin_level: { type: number, description: 发布预测时的实测水位，用于算持久化基线误差 }
        base_level: { type: number }

    ModelVersion:
      type: object
      properties:
        version: { type: string }
        active: { type: boolean }
        trained_at: { type: integer }
        train_seconds: { type: number }
        folds: { type: integer }
        size_mb: { type: number }
        rmse_3h: { type: number, nullable: true }
        skill_3h: { type: number, nullable: true }

    RetrainStatus:
      type: object
      properties:
        status: { type: string, enum: [idle, running, done, error] }
        started_at: { type: integer, nullable: true }
        finished_at: { type: integer, nullable: true }
        version: { type: string, nullable: true }
        seconds: { type: number, nullable: true }
        error: { type: string, nullable: true }

    Rules:
      type: object
      description: |
        研判规则文档。改它秒级生效，不需要重训。

        **不可配置的三条红线**：两道硬约束只能降不能升；权重必须和为 1；
        分档必须严格递增、最短持续必须非递减。
      properties:
        weights:
          type: object
          required: [peak, duration, trend]
          description: 三因子权重，必须和为 1
          properties:
            peak: { type: number, example: 0.45 }
            duration: { type: number, example: 0.35 }
            trend: { type: number, example: 0.20 }
        score_cutoffs:
          type: object
          description: 综合分分档，必须严格递增
          properties:
            blue: { type: number, example: 0.22 }
            yellow: { type: number, example: 0.40 }
            orange: { type: number, example: 0.60 }
            red: { type: number, example: 0.78 }
        min_duration_min:
          type: object
          description: 各级最短超阈持续时间。未达标则封顶降级（只降不升）。
          properties:
            blue: { type: integer, example: 20 }
            yellow: { type: integer, example: 30 }
            orange: { type: integer, example: 45 }
            red: { type: integer, example: 60 }
        duration_saturation_min:
          type: integer
          description: 持续时间因子的饱和点，超过它不再加分
          example: 180
        trend_upgrade_slope:
          type: number
          description: 上涨到该速率（米/小时）时升一级
          example: 0.25
        trend_downgrade_slope:
          type: number
          description: 退水到该速率时降一级
          example: -0.15
        trend_score_span:
          type: number
          example: 0.5
        horizon_min:
          type: integer
          description: 研判窗口（分钟）。取 180 是因为 3 小时是最关心的预见期。
          example: 180
        min_level_for_alarm:
          type: integer
          minimum: 1
          maximum: 4
          description: |
            **等级序，不是分值**：1=蓝 2=黄 3=橙 4=红。低于它的等级直接压成 `none`。

            这个字段曾经被前端当成「最低综合分」渲染成 0~1 输入框，读起来像
            「0.22 分才报警」。一个字段的语义如果两种读法都说得通，必须在 UI 上消歧。
          example: 1

    RulesPatch:
      type: object
      description: 部分更新。子字典逐键合并，不是整块替换。
      additionalProperties: true

    RulesImpact:
      type: object
      properties:
        changes:
          type: array
          items:
            type: object
            properties:
              site_id: { type: string }
              name: { type: string }
              before_level: { $ref: "#/components/schemas/Level" }
              before_score: { type: number }
              after_level: { $ref: "#/components/schemas/Level" }
              after_score: { type: number }
              before_reason: { type: string }
              after_reason: { type: string }
              direction: { type: string, enum: [up, down, same] }
        summary:
          type: object
          properties:
            upgraded: { type: integer }
            downgraded: { type: integer }
            unchanged: { type: integer }
            total: { type: integer }

    User:
      type: object
      properties:
        username: { type: string }
        display_name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        active: { type: boolean }
        created_at: { type: integer }
        last_login_at: { type: integer, nullable: true }

    AuditEntry:
      type: object
      properties:
        id: { type: integer }
        at: { type: integer }
        actor: { type: string, description: 会话用户；未登录时为 "-" }
        role: { type: string }
        method: { type: string }
        path: { type: string }
        status: { type: integer }
        duration_ms: { type: number }
        ip: { type: string }
        request_id: { type: string }
        summary: { type: string, description: "人读的一句话，如「确认预警 #202」" }

    NotifyChannel:
      type: object
      properties:
        kind: { type: string, enum: [inapp, webhook, email, sms] }
        enabled: { type: boolean }
        url: { type: string, description: webhook 地址 }
        secret: { type: string, description: 读取时打码，只保留末 4 位 }
        min_level: { $ref: "#/components/schemas/Level" }
        quiet_minutes: { type: integer, description: 同站点同等级的去抖窗口 }

    Delivery:
      type: object
      properties:
        id: { type: integer }
        at: { type: integer }
        channel: { type: string }
        alert_id: { type: integer, nullable: true }
        site_id: { type: string }
        level: { $ref: "#/components/schemas/Level" }
        ok: { type: boolean }
        detail: { type: string, description: 失败原因原话 }
