# 城市内涝水位预测系统 · Docker Compose 部署（方案 A）
# 前置：前端 dist 已构建（npm ci && npm run build）并放在 ./frontend-dist
# 启动：docker compose -f deploy/docker-compose.yml up -d

services:
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: waterlog-backend
    restart: unless-stopped
    environment:
      - ADDR=:8080
      - DB_PATH=/data/app.db
      - DEMO_MODE=false
      - OPENMETEO_ENABLED=true
      - FORECAST_SCHEDULE_MIN=5
      - CORS_ORIGINS=http://localhost,http://localhost:5173
    volumes:
      - ./data:/data
    networks:
      - waterlog
    healthcheck:
      test: ["CMD", "/app/waterlog-server", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    image: nginx:1.27-alpine
    container_name: waterlog-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend-dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - waterlog

networks:
  waterlog:
    driver: bridge
