# 城市内涝水位预测系统 · 前端 nginx 托管配置示例
# 用法：nginx -c /path/to/nginx.conf（或 include 到 http{} 中）
# 前提：已执行 npm run build，dist 目录与本配置的 root 路径一致

worker_processes auto;
error_log /var/log/nginx/waterlog_error.log warn;
pid /run/nginx_waterlog.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /var/log/nginx/waterlog_access.log;

    sendfile      on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name _;

        # 前端静态产物（SPA）
        root /opt/waterlog/frontend/dist;
        index index.html;

        # 静态资源缓存
        location /assets/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # API 反代到 Go 后端（与前端 VITE_API_BASE_URL=/api/v1 配套）
        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # SSE（/api/v1/stream/alerts）透传：关闭缓冲、长超时
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # SPA 路由回退（react-router BrowserRoute）
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
